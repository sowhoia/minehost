name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    permissions: { contents: write }
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cd app && npm install
      # Подпись macOS: APPLE_CERTIFICATE (base64 .p12) + пароль + identity
      # убирают «приложение повреждено» → остаётся «непроверенный
      # разработчик» (Настройки → Открыть всё равно). APPLE_ID +
      # APPLE_PASSWORD (app-specific) + APPLE_TEAM_ID добавляют
      # нотаризацию (нужен Developer ID из платной Apple Developer
      # Program) — тогда никаких диалогов вовсе. Секреты прокидываем
      # в env только НЕПУСТЫМИ: пустая APPLE_CERTIFICATE роняет
      # codesign у tauri (так упал v1.0.1s).
      - name: Apple signing env (только заданные секреты)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="${!v}"
            if [ -n "$val" ]; then
              { echo "$v<<__MH_EOF__"; echo "$val"; echo "__MH_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          # Не-Apple (самоподписанный) сертификат codesign «не находит»,
          # пока цепочка не доверена — заносим его в системную связку.
          # Для настоящего Developer ID шаг безвреден и не нужен.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 -d > /tmp/mh-sign.p12
            openssl pkcs12 -in /tmp/mh-sign.p12 \
              -passin "pass:$APPLE_CERTIFICATE_PASSWORD" \
              -nokeys -clcerts -out /tmp/mh-sign.pem
            sudo security add-trusted-cert -d -r trustRoot \
              -k /Library/Keychains/System.keychain /tmp/mh-sign.pem
            rm /tmp/mh-sign.p12 /tmp/mh-sign.pem
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # ключ подписи сгенерирован без пароля
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "MineHost ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: true

  # дописывает платформу (windows/macos/linux) в имена файлов релиза,
  # чтобы было понятно, что качать, и правит ссылки в latest.json
  platform-names:
    needs: build
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - name: Rename assets and patch latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rel_id=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)
          test -n "$rel_id"
          gh api "repos/$REPO/releases/$rel_id/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' > assets.tsv
          : > renames.tsv
          while IFS=$'\t' read -r id name; do
            base="$name" sig=""
            case "$base" in *.sig) sig=".sig" base="${base%.sig}" ;; esac
            case "$base" in
              *.msi|*.exe|*.nsis.zip|*.msi.zip) plat="windows" ;;
              # «aarch64» мало кому что-то говорит — пишем Apple Silicon явно
              *aarch64*.dmg|*aarch64*.app.tar.gz) plat="macos-AppleSilicon" ;;
              *.dmg|*.app.tar.gz)               plat="macos"   ;;
              *.AppImage|*.deb|*.rpm)           plat="linux"   ;;
              *) continue ;;
            esac
            case "$base" in *windows*|*macos*|*linux*) continue ;; esac
            case "$base" in
              MineHost*) new="MineHost_${plat}${base#MineHost}${sig}" ;;
              *)         new="${plat}_${base}${sig}" ;;
            esac
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" --silent
            printf '%s\t%s\n' "$name" "$new" >> renames.tsv
            echo "renamed: $name -> $new"
          done < assets.tsv
          lat_id=$(gh api "repos/$REPO/releases/$rel_id/assets" --paginate \
            --jq '.[] | select(.name=="latest.json") | .id' | head -n1)
          if [ -n "$lat_id" ] && [ -s renames.tsv ]; then
            gh api -H "Accept: application/octet-stream" \
              "repos/$REPO/releases/assets/$lat_id" > latest.json
            python3 - <<'PY'
          rows = [l.rstrip("\n").split("\t") for l in open("renames.tsv") if l.strip()]
          rows.sort(key=lambda r: -len(r[0]))
          data = open("latest.json", encoding="utf-8").read()
          for old, new in rows:
              data = data.replace(old, new)
          open("latest.json", "w", encoding="utf-8").write(data)
          PY
            gh api -X DELETE "repos/$REPO/releases/assets/$lat_id" --silent
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" --data-binary @latest.json \
              "https://uploads.github.com/repos/$REPO/releases/$rel_id/assets?name=latest.json" > /dev/null
            echo "latest.json patched"
          fi
