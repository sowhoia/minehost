[package]
name = "mine-host-core"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
iroh = "0.98.2"
iroh-tickets = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# features=["all"]: set_reuse_port и прочие unix-методы
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
