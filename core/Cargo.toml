[package]
name = "mine-host-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
iroh = "0.98.2"
iroh-tickets = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
